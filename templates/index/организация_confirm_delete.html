{% extends 'base.html' %}
{% load static %}
{% block content %}

<p>Вы действительно хотите удалить организацию «{{ organization.ПолноеНаименование }}»?</p>
<form method="post">

    <button type="submit">Да, удалить</button>
    <a href="{% url 'организации_list' %}">Отмена</a>
</form>
{% endblock %}
